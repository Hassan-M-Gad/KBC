name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > build_log.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -n 300 build_log.txt

      - name: Copy APK for commit
        if: steps.build.outputs.exit_code == '0'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/camera-diag-debug.apk

      - name: Commit log and APK
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -f build_log.txt
          git add -f release/camera-diag-debug.apk 2>/dev/null || true
          git commit -m "chore: build artifacts from run ${{ github.run_id }} [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-diag-debug-apk
          path: app/build/outputs/apk/debug/*.apk
